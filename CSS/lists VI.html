<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lists VI</title>
</head>
<style>
    
    li {
        list-style: none;
        border: 1px solid black;
        border-collapse: collapse;
        padding: 10px;
    }
    li:hover {
        content:url("flecha_activa.png"); 
        color: #e4e4e4;
    }
    li::before {
        content:url("flecha_inactiva.png");
        margin-right: 10px;
    }

</style>

<body>
    <ul>
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
        <li>Elemento 4</li>
        <li>Elemento 5</li>
        <li>Elemento 6</li>
    </ul>


</body>

</html>
