<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Manager</title>

   

            <script src="script.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f4f4f4;
        }

        form {
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            padding: 10px;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        table {
            margin-top: 30px;
            border-collapse: collapse;
            width: 600px;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

    <h2>Add Student</h2>

    <form id="studentForm">
        <input type="text" id="name" placeholder="Student Name">
        <input type="number" id="age" placeholder="Age">
        <input type="number" id="score" placeholder="Score (0-100)">
        <button id="btn" type="submit">Save Student</button>
        <p id="message"></p>
    </form>

   

    <h2>Saved Data: </h2>

    <p id="info">

    </p>

     <script>  let boton = document.getElementById("btn");
            let informacion = document.getElementById("info");
            boton.addEventListener("click", validateInput);

            window.onload = function () {
                informacion.textContent = localStorage.getItem("datosNombre")+" "+ localStorage.getItem("datosEdad")+" "+localStorage.getItem("datosPuntuacion");


            }</script>





</body>

</html>
