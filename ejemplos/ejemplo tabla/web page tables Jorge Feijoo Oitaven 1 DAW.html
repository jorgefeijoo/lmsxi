<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla</title>
<style>
    table, td , th {
        border: 1px solid black;
        border-collapse: collapse;
    }
    td, th{
        
        padding: 15px;
    }
    th, td {
        text-align: right;
        padding: 15px;
    }
    
    
    
</style>
</head>
<body>
   <table style="width: 100%;">
    <tr><th style="width: 50%;"><b>Name</b></th><th><b>Surname 1</b></th><th><b>Surname 2</b></th></tr>
    <tr><td  style="width: 50%;" >Laura</td><td>Agulla</td><td>González</td></tr>
    <tr><td  style="width: 50%;">Pepe</td><td style="color: red;">Otero</td><td>Castro</td></tr>
     <tr><td  style="width: 50%;text-align: left;" >Iria</td><td style="text-align: left;">Agulla</td><td style="text-align: left;">Castro</td></tr>
    </table>
</body>
</html>
